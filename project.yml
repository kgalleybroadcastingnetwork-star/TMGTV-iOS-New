name: TMGTV
options:
  bundleIdPrefix: com.kgalleymedia
  deploymentTarget:
    iOS: '15.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UIRequiresFullScreen: NO
    INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsArbitraryLoadsInWebContent: YES
    PRODUCT_BUNDLE_IDENTIFIER: com.kgalleymedia.tmgtv
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 1
    CODE_SIGN_STYLE: Automatic
targets:
  TMGTV:
    type: application
    platform: iOS
    sources:
      - path: TMGTV
        excludes:
          - Resources
      - path: TMGTV/Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: TMG TV
        INFOPLIST_KEY_CFBundleDisplayName: TMG TV
        SUPPORTS_MACCATALYST: NO
